server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: server

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/dearjolly?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${MYSQL_USER:jolly}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 소유하고 Hibernate 는 대조만 한다. 전 환경 validate 로 고정한다.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    # 응답 DTO 는 서비스 트랜잭션 안에서 조립하므로 뷰 렌더링 시점에 쿼리가 나갈 일이 없다.
    # 켜 두면 요청 내내 커넥션을 붙잡고 있어 끈다.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  # 스키마 소유자는 Flyway 하나다.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    # 초기 데이터에는 파일 키만 들어가므로 환경 의존 placeholder 가 필요 없다.

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# 헬스체크만 연다. 나머지 actuator 엔드포인트는 인증 경로가 없어 노출하지 않는다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

# Swagger UI 는 그룹 목록의 첫 문서를 먼저 띄운다. 지정하지 않으면 도메인 그룹 하나가 열려
# 전체 API 를 보려면 매번 드롭다운을 만져야 한다.
springdoc:
  swagger-ui:
    urls-primary-name: 전체

# ===== MinIO (우표 이미지 저장소) =====
minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}       # 서버 → MinIO 내부 호출용
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://localhost:9000}  # 클라이언트에 내려줄 이미지 URL 기준
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET:dear-jolly-stamps}

dearjolly:
  # 우표 시드. 기동할 때마다 seed/stamps 이미지를 MinIO 에 올리고 STAMPS 행을 맞춘다.
  # 오브젝트·행이 이미 있으면 건너뛰므로 재기동·블루그린 배포에서 반복 실행돼도 안전하다.
  seed:
    stamp:
      enabled: ${STAMP_SEED_ENABLED:true}
      location: classpath*:seed/stamps/*.png
      key-prefix: stamp/

    # API 테스트용 목 사용자 시드. 약관 동의·닉네임까지 끝난 계정 하나와 편지 몇 통을 넣는다.
    # 같은 소셜 식별자·같은 편지 본문은 다시 만들지 않으므로 재기동해도 데이터가 불어나지 않는다.
    # 운영에 실제 계정처럼 보이는 행이 생기면 안 되므로 기본값은 꺼짐이다.
    mock-user:
      enabled: ${MOCK_USER_SEED_ENABLED:false}
      oauth-provider: ${MOCK_USER_OAUTH_PROVIDER:KAKAO}
      oauth-id: ${MOCK_USER_OAUTH_ID:mock-user}
      email: ${MOCK_USER_EMAIL:mock@dearjolly.local}
      nickname: ${MOCK_USER_NICKNAME:jolly}

  jwt:
    secret: ${JWT_SECRET}
    access-expire-millis: ${JWT_ACCESS_EXPIRE:1800000}      # 30분
    refresh-expire-millis: ${JWT_REFRESH_EXPIRE:1209600000} # 14일

  terms:
    current-version: ${TERMS_CURRENT_VERSION:1.0.0}

  withdrawal:
    retention-days: ${WITHDRAWAL_RETENTION_DAYS:30}

  # 앱 최소 지원 버전과 정책 페이지 URL.
  # platforms 아래 값을 채우면 그 플랫폼만 공통 값을 덮어쓴다.
  # force-update 는 강제 업데이트 캠페인을 켜는 운영 스위치다. 서버는 앱 버전을 모르므로 두 버전 값에서 유추하지 않는다.
  version:
    latest: ${APP_LATEST_VERSION:1.0.0}
    min-supported: ${APP_MIN_SUPPORTED_VERSION:1.0.0}
    force-update: ${APP_FORCE_UPDATE:false}
    privacy-policy-url: ${POLICY_PRIVACY_URL:https://dearjolly.com/privacy}
    terms-of-service-url: ${POLICY_TERMS_URL:https://dearjolly.com/terms}
    notice-url: ${POLICY_NOTICE_URL:https://dearjolly.com/notice}
    platforms:
      IOS:
        latest: ${APP_LATEST_VERSION_IOS:}
        min-supported: ${APP_MIN_SUPPORTED_VERSION_IOS:}
      AOS:
        latest: ${APP_LATEST_VERSION_AOS:}
        min-supported: ${APP_MIN_SUPPORTED_VERSION_AOS:}

  oauth:
    # 인증 완료 후 앱으로 돌아갈 딥링크. 토큰이 쿼리 파라미터로 실린다.
    app-redirect-uri: ${OAUTH_APP_REDIRECT_URI:dearjolly://auth/callback}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/api/v1/auth/kakao/callback}
      admin-key: ${KAKAO_ADMIN_KEY:}
    apple:
      client-id: ${APPLE_CLIENT_ID:}
      team-id: ${APPLE_TEAM_ID:}
      key-id: ${APPLE_KEY_ID:}
      private-key: ${APPLE_PRIVATE_KEY:}
      redirect-uri: ${APPLE_REDIRECT_URI:http://localhost:8080/api/v1/auth/apple/callback}
