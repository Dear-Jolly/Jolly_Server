spring:
  profiles:
    active: test
  ai:
    openai:
      api-key: test-openai-api-key
      chat:
        options:
          model: gpt-4o-mini
  datasource:
    url: jdbc:h2:mem:dearjolly;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        # 쿼리 수를 세어 N+1 을 잡아내는 테스트가 있다.
        generate_statistics: true
  flyway:
    enabled: false

minio:
  endpoint: http://localhost:9000
  public-endpoint: http://localhost:9000
  access-key: test-access-key
  secret-key: test-secret-key
  bucket: dear-jolly-stamps

dearjolly:
  # 통합 테스트는 각자 필요한 데이터만 만든다. 시드가 끼면 개수 검증이 어긋난다.
  seed:
    stamp:
      enabled: false
    app-version:
      enabled: false
    user:
      enabled: false

  jwt:
    secret: test-jwt-secret-key-for-integration-tests-32bytes+
    access-expire-millis: 1800000
    refresh-expire-millis: 1209600000
  terms:
    current-version: 1.0.0
  withdrawal:
    retention-days: 30
  admin:
    username: test-admin
    password: test-admin-password
  oauth:
    app-redirect-uri: dearjolly://auth/callback
    kakao:
      client-id: test-kakao-client-id
      client-secret: ""
      redirect-uri: http://localhost:8080/api/v1/auth/kakao/callback
      admin-key: ""
    apple:
      client-id: com.dearjolly.test
      team-id: TESTTEAMID
      key-id: TESTKEYID
      private-key: ""
      redirect-uri: http://localhost:8080/api/v1/auth/apple/callback

springdoc:
  swagger-ui:
    urls-primary-name: 전체
