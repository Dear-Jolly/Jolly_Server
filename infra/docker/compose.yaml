name: dear-jolly

services:
  # ===== Caddy (외부 진입점. https://localhost:8080 을 종단한다) =====
  caddy:
    image: caddy:2.9-alpine
    container_name: dear-jolly-caddy
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"      # HTTPS
      - "${APP_HTTP_PORT:-80}:80"     # HTTP → HTTPS 리다이렉트
    environment:
      APP_PORT: ${APP_PORT:-8080}
    volumes:
      - ../caddy/Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - dear-jolly

  # ===== MySQL =====
  mysql:
    image: mysql:8.4
    container_name: dear-jolly-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+09:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # 프로젝트 루트(dear-jolly/mount/mysql)에 저장한다. 컨테이너를 지워도 데이터가 남는다.
      - ${MYSQL_DATA_PATH:-../../../mount/mysql}:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - dear-jolly

  # ===== MinIO (우표 이미지 오브젝트 스토리지) =====
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: dear-jolly-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${MINIO_API_PORT:-9000}:9000"    # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # 웹 콘솔
    volumes:
      - ${MINIO_DATA_PATH:-../../../mount/minio}:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - dear-jolly

  # ===== MinIO 초기화 (버킷 생성 + 공개 읽기 권한) =====
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    container_name: dear-jolly-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$MINIO_BUCKET &&
      mc anonymous set download local/$$MINIO_BUCKET &&
      echo '[minio-init] 버킷 준비 완료: '$$MINIO_BUCKET
      "
    networks:
      - dear-jolly

  # ===== Spring Boot 애플리케이션 =====
  app:
    build:
      # 컨텍스트는 리포지터리 루트 (소스·gradle 파일이 거기 있다)
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: dear-jolly-server:local
    container_name: dear-jolly-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # .env.local 의 값을 통째로 주입한다. 설정이 늘어도 compose 를 고칠 필요가 없다.
    env_file:
      - ../env/.env.local
    environment:
      # 아래는 compose 가 조립하는 값이라 env_file 보다 우선한다
      TZ: Asia/Seoul
      SERVER_PORT: ${APP_INTERNAL_PORT:-8081}
      # --- DB ---
      MYSQL_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-create}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-true}
      # --- MinIO ---
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:${MINIO_API_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      # 디버깅용 직접 접근. 외부 진입점은 Caddy 다
      - "127.0.0.1:${APP_INTERNAL_PORT:-8081}:${APP_INTERNAL_PORT:-8081}"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/${APP_INTERNAL_PORT:-8081}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - dear-jolly

volumes:
  caddy-data:
  caddy-config:

networks:
  dear-jolly:
    driver: bridge
